{% extends "base.html" %}

{% block content %}
<div style="width: 50%; height: 500px; margin: auto" class="pt-5">
    <h3>Movie rating form</h3>
      <form method='post' action="{% url 'about' %}">
        {% csrf_token %}
        <div class="form-group mb-3">
            <label for="exampleInputName">Name</label>
            <input type="text" class="form-control" id="exampleInputName" aria-describedby="nameHelp" placeholder="Enter name" name='username'>
        </div>
        <div class="form-group mb-3">
            <label for="exampleInputEmail">Email</label>
            <input type="email" class="form-control" id="exampleInputEmail" placeholder="Enter Email" name='email'>
        </div>
        <select class="form-select" aria-label="Default select example" name="select">
        <option selected>Ratings</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        </select>
        <button type="submit" class="btn btn-primary mt-2">Submit</button>
    </form>
</div>


{% endblock %}
